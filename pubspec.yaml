name: yogai
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  url_launcher: ^6.1.10
  flutter:
    sdk: flutter
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  flutter_tts: ^4.2.3
  video_player: ^2.10.0
  chewie: ^1.13.0
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  get: ^4.6.6
  firebase_auth: ^6.1.2
  fl_chart: ^1.1.1
  google_sign_in: ^6.1.4
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1
  cupertino_icons: ^1.0.8
  lottie: ^3.3.2
  vibration: ^3.1.4
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  timezone: ^0.10.1
  camera: ^0.10.6
  http: ^1.2.2
  fluttertoast: ^8.2.6
  device_info_plus: ^10.1.2
  google_mlkit_pose_detection: ^0.14.0
  google_fonts: ^6.3.2
  tflite_flutter:
    git:
      url: https://github.com/tensorflow/flutter-tflite.git # <-- The OFFICIAL repository
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/onboarding/
    - assets/whistle.mp3
    - assets/hectorbell.mp3
    - assets/animations/
    - assets/models/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

  assets:
    - images/
    - images/onboarding/ # New: onboarding-specific images

  # === FONTS ===
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
